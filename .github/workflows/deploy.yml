name: Vercel Production Deployment

on:
  # Deploy khi push vào các nhánh frontend.
  push:
    branches:
      - 'blue/*fe*'
      - 'blue/**/*fe*'
      - 'blue/*frontend*'
      - 'blue/**/*frontend*'
      # Sửa/thêm pattern nhánh ở đây nếu cần.

  # Chạy kiểm tra/deploy preview khi mở PR vào các nhánh frontend.
  pull_request:
    branches:
      - 'blue/*fe*'
      - 'blue/**/*fe*'
      - 'blue/*frontend*'
      - 'blue/**/*frontend*'
      # Sửa/thêm pattern nhánh theo ý bạn.

concurrency:
  # Hủy workflow cũ trên cùng nhánh để tiết kiệm thời gian deploy.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Cần cấu hình 3 secrets này trong GitHub repo settings.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Deployment Environment
        run: |
          # Nhánh này deploy production, các nhánh còn lại deploy preview.
          if [ "${{ github.ref_name }}" = "blue/main-frontend" ]; then
            echo "VERCEL_ENV=production" >> $GITHUB_ENV
            echo "VERCEL_ARGS=--prod" >> $GITHUB_ENV
          else
            echo "VERCEL_ENV=preview" >> $GITHUB_ENV
            echo "VERCEL_ARGS=" >> $GITHUB_ENV
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Cache Next.js Build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ hashFiles('frontend/**/*.js', 'frontend/**/*.jsx', 'frontend/**/*.ts', 'frontend/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/pnpm-lock.yaml') }}-

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        working-directory: ./frontend
        run: vercel pull --yes --environment=${{ env.VERCEL_ENV }}

      - name: Build Project Artifacts
        working-directory: ./frontend
        run: vercel build ${{ env.VERCEL_ARGS }}

      - name: Deploy Project Artifacts to Vercel
        working-directory: ./frontend
        run: vercel deploy --prebuilt ${{ env.VERCEL_ARGS }}
