name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./test.db
      SECRET_KEY: test-secret-key-with-enough-length
      ENFORCE_RBAC: "false"
      LLM_PROVIDER: offline
      LLM_PROVIDER_CHAIN: offline
      EMBEDDING_PROVIDER_CHAIN: offline
      RERANK_PROVIDER: offline
      INTERNAL_SERVICE_TOKEN: test-internal-service-token
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint backend
        run: python -m ruff check app tests scripts alembic

      - name: Type-check backend
        run: python -m mypy app --ignore-missing-imports --no-error-summary

      - name: Test backend
        run: python -m pytest

      - name: Check Alembic migrations
        env:
          DATABASE_URL: sqlite:////tmp/vinuni-career-migration-check.db
        run: |
          rm -f /tmp/vinuni-career-migration-check.db
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      BACKEND_URL: http://127.0.0.1:8000/api/v1
      NEXT_PUBLIC_APP_DOMAIN: example.com
      NEXT_PUBLIC_DEFAULT_LOCALE: vi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm lint

      - name: Type-check frontend
        run: pnpm check-types

      - name: Build frontend
        run: pnpm build

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs:
      - backend-ci
      - frontend-ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy production
        if: env.VERCEL_TOKEN != ''
        run: |
          pnpm dlx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          pnpm dlx vercel@latest build --prod --token="$VERCEL_TOKEN"
          pnpm dlx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Explain skipped deployment
        if: env.VERCEL_TOKEN == ''
        run: |
          echo "Set the VERCEL_TOKEN GitHub secret to enable production deploys."
