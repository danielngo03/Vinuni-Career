services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: c2_app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d c2_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2
    profiles: ["search"]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
    env_file:
      - ../../.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/c2_app
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CACHE_BACKEND: redis
      SEARCH_BACKEND: memory
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT: /app/.data/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/worker.Dockerfile
    env_file:
      - ../../.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/c2_app
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CACHE_BACKEND: redis
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  opensearch_data:
