[project]
name = "vinuni-career-platform-backend"
version = "0.1.0"
description = "B2B2C AI career platform backend MVP"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=22.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.32",
    "alembic>=1.13.2",
    "psycopg[binary]>=3.2.1",
    "PyJWT[crypto]>=2.10.0",
    "python-multipart>=0.0.9",
    "scalar-fastapi>=1.8.2",
    "celery>=5.4.0",
    "redis>=5.0.8",
    "httpx>=0.27.0",
    "boto3>=1.35.0",
    "orjson>=3.10.7",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.3",
    "mypy>=1.11.1",
]
ai-production = [
    "langgraph>=0.2.70",
    "instructor>=1.7.0",
    "python-magic>=0.4.27",
    "pypdf>=5.0.0",
    "python-docx>=1.1.2",
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    "rapidfuzz>=3.10.0",
    "flashrank>=0.2.10",
    "langfuse>=2.53.0",
    "litellm>=1.52.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "B008",
    "E501",
    "SIM102",
    "UP042",
]
