# pnpm settings (pnpm v11 reads project settings from here).
# Skip the auto `pnpm install` that runs before each script — it treats the
# optional native build scripts below as fatal in this pnpm version.
verifyDepsBeforeRun: false
# Approve optional native build scripts needed by Next/eslint dependencies in
# clean CI installs; pnpm 11 treats unapproved builds as fatal.
allowBuilds:
  sharp: true
  unrs-resolver: true
